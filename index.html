<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Demo Sandbox</title>
  <style>
    :root {
      color-scheme: dark light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      background: #111;
      color: #eee;
    }
    main {
      max-width: 36rem;
      padding: 1.5rem;
      text-align: center;
    }
    a.demo {
      display: block;
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: 0.75rem;
      background: #1c2740;
      color: inherit;
      text-decoration: none;
      border: 1px solid #3d6ad6;
    }
    a.demo strong { display: block; }
    a.demo span {
      display: block;
      margin-top: 0.2rem;
      color: #8b93a7;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cursor Demo Sandbox</h1>
    <p>Diego's Cursor Cloud Agent sandbox — if you can see this, previews work.</p>
    <a class="demo" href="/ta/">
      <strong>Paper TA board</strong>
      <span>BINANCE:BTCUSDT buy / sell / neutral · paper only</span>
    </a>
  </main>
</body>
</html>
